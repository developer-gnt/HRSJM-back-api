name: Deploy Backend to VPS (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Step 1: CI - Validate and Build Code
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Application
        run: npm run build

  # Step 2: CD - Deploy to Hostinger VPS
  deploy:
    name: Deploy to Production VPS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting automated deployment for HRSJM-back-api..."
            
            # Navigate to project directory
            cd /root/HRSJM-back-api || cd ~/HRSJM-back-api
            
            # Pull latest changes from main branch
            echo "📥 Pulling latest changes from git..."
            git fetch origin main
            git reset --hard origin/main
            
            # Install production dependencies
            echo "📦 Installing dependencies..."
            npm install --legacy-peer-deps
            
            # Build NestJS production bundle
            echo "🔨 Building application..."
            npm run build
            
            # Restart PM2 process
            echo "🔄 Reloading PM2 process (hrsjm-api)..."
            pm2 reload hrsjm-api --update-env || pm2 restart hrsjm-api
            pm2 save
            
            echo "✅ Deployment successful and verified!"
