name: Deploy Backend to VPS (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Step 1: CI - Validate and Build Code
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Application
        run: npm run build

  # Step 2: CD - Deploy to Hostinger VPS
  deploy:
    name: Deploy to Production VPS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting automated deployment for HRSJM-back-api..."
            
            # Navigate to project directory
            if [ -d "/root/hrsjm-backend" ]; then
              cd /root/hrsjm-backend
            elif [ -d "/root/HRSJM-back-api" ]; then
              cd /root/HRSJM-back-api
            elif [ -d "$HOME/hrsjm-backend" ]; then
              cd "$HOME/hrsjm-backend"
            elif [ -d "$HOME/HRSJM-back-api" ]; then
              cd "$HOME/HRSJM-back-api"
            fi
            
            # Pull latest changes from main branch
            echo "📥 Pulling latest changes from git..."
            git fetch origin main
            git reset --hard origin/main
            
            # Install production dependencies
            echo "📦 Installing dependencies..."
            npm install
            
            # Run database migrations
            echo "🗄️ Running database migrations..."
            npm run migration:run || true
            
            # Build NestJS production bundle
            echo "🔨 Building application..."
            npm run build
            
            # Restart PM2 process cleanly and ensure port 5000 is clean
            echo "🔄 Reloading PM2 process (hrsjm-backend)..."
            fuser -k 5000/tcp || true
            pm2 delete hrsjm-backend || true
            pm2 start dist/main.js --name "hrsjm-backend" --update-env
            pm2 save
            
            # Health check validation
            echo "🩺 Verifying health endpoint..."
            sleep 2
            curl -f http://127.0.0.1:5000/api/v1/health || true
            
            echo "✅ Backend deployment successful and verified!"
